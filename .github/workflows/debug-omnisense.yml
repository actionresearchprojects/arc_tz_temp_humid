name: Debug Omnisense fetch

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Omnisense (debug mode)
        env:
          OMNISENSE_USERNAME: ${{ secrets.OMNISENSE_USERNAME }}
          OMNISENSE_PASSWORD: ${{ secrets.OMNISENSE_PASSWORD }}
        run: python fetch_omnisense.py --debug

      - name: Upload debug HTML responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnisense-debug-responses
          path: |
            dnld_rqst.html
            dnld_rqst5_response.html
          if-no-files-found: warn
