name: Update dashboard data

on:
  schedule:
    - cron: '0 4 * * *'  # daily at 04:00 UTC
  workflow_dispatch:       # manual trigger from GitHub UI

concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install pandas pytz requests

      - name: Fetch climate cycle data (ENSO, IOD, MJO)
        continue-on-error: true
        run: python fetch_cycles.py

      - name: Fetch Open-Meteo data (Tanzania)
        continue-on-error: true
        run: python fetch_openmeteo.py --location tz

      # Grove and Holywell are ~150 km apart, so each needs its own feed; both
      # are shown on the ARC UK chart and drive their own building's adaptive
      # comfort running mean.
      - name: Fetch Open-Meteo data (Grove Cottage)
        continue-on-error: true
        run: python fetch_openmeteo.py --location grove

      - name: Fetch Open-Meteo data (Holywell Barn)
        continue-on-error: true
        run: python fetch_openmeteo.py --location holywell

      - name: Fetch Omnisense data (Tanzania)
        continue-on-error: true
        env:
          OMNISENSE_USERNAME: ${{ secrets.OMNISENSE_USERNAME }}
          OMNISENSE_PASSWORD: ${{ secrets.OMNISENSE_PASSWORD }}
        run: python fetch_omnisense.py --site tz

      # One export covers Grove Cottage and Holywell Barn; build.py filters it
      # by sensor id. Same credentials as the Tanzanian site, different site_nbr.
      - name: Fetch Omnisense data (UK)
        continue-on-error: true
        env:
          OMNISENSE_USERNAME: ${{ secrets.OMNISENSE_USERNAME }}
          OMNISENSE_PASSWORD: ${{ secrets.OMNISENSE_PASSWORD }}
        run: python fetch_omnisense.py --site uk

      # ── staleness check ────────────────────────────────────────────────────
      # Runs after all fetches (even if some fail) and always writes
      # data/status.json. Exits 1 if any source is stale.
      - name: Check data staleness
        id: staleness
        continue-on-error: true
        run: python check_staleness.py

      - name: Rebuild dashboard
        run: python build.py --auto

      - name: Commit and push if changed
        id: push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/openmeteo/ data/status.json index.html status.html
          [ -d data/omnisense ] && git add data/omnisense/ || true
          [ -d data/cycles ]   && git add data/cycles/    || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "auto-update data $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded on attempt $i"
                echo "changed=true" >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "Push attempt $i failed; rebasing onto remote and retrying"
              git pull --rebase origin main
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi

      # ── push status.json + status.html to main site ────────────────────────
      - name: Push status page to main site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAIN_SITE_PAT }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.MAIN_SITE_PAT }}@github.com/actionresearchprojects/actionresearchprojects.github.io.git \
            /tmp/main_site
          cp data/status.json /tmp/main_site/status.json
          cp status.html       /tmp/main_site/status.html
          cd /tmp/main_site
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add status.json status.html
          if git diff --cached --quiet; then
            echo "Status page unchanged - no commit needed"
          else
            git commit -m "auto: update status page $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Trigger main site sync
        if: steps.push.outputs.changed == 'true'
        run: |
          # source_repo names the repo as it is on GitHub. The main site's
          # sync-embedded.yml maps both this and the former arc_tz_temp_humid to
          # embedded/arc_temp_humid/, so the two never had to change in lockstep.
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MAIN_SITE_PAT }}" \
            https://api.github.com/repos/actionresearchprojects/actionresearchprojects.github.io/dispatches \
            -d '{"event_type":"sync-embedded","client_payload":{"source_repo":"arc_temp_humid"}}'

      # ── cascade: trigger dependent dashboards so they always get fresh data ──
      - name: Trigger arc_tz_line update
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MAIN_SITE_PAT }}" \
            https://api.github.com/repos/actionresearchprojects/arc_tz_line/dispatches \
            -d '{"event_type":"update-from-temp-humid"}'

      - name: Trigger arc_tz_weather update
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MAIN_SITE_PAT }}" \
            https://api.github.com/repos/actionresearchprojects/arc_tz_weather/dispatches \
            -d '{"event_type":"update-from-temp-humid"}'

      # ── alerts (only fire when staleness check flagged stale data) ─────────
      - name: Send email alert
        if: always() && (steps.staleness.outputs.stale == 'true' || steps.staleness.outcome == 'failure')
        continue-on-error: true
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
        run: python send_alert_email.py

      - name: Send ntfy notification
        if: always() && (steps.staleness.outputs.stale == 'true' || steps.staleness.outcome == 'failure')
        continue-on-error: true
        run: |
          MSG=$(cat /tmp/ntfy_body.txt 2>/dev/null || echo "One or more ARC data sources are out of date. Status page: https://actionresearchprojects.net/status")
          curl -s -X POST \
            -H "Title: ARC Data Pipeline Alert" \
            -H "Priority: high" \
            -d "$MSG" \
            https://ntfy.sh/arc-ecovillage-status-7k3m
