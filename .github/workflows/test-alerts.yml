name: Test alert system

on:
  workflow_dispatch:   # run manually from GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "ARC Monitor: alert system test"
          to: ${{ secrets.ALERT_EMAILS }}
          from: ARC Monitor <${{ secrets.GMAIL_USERNAME }}>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head><meta charset="utf-8"></head>
            <body style="font-family:system-ui,-apple-system,sans-serif;color:#111827;line-height:1.5;max-width:600px;margin:0 auto;padding:24px;">
              <h2 style="font-size:18px;margin:0 0 4px;">ARC Monitor: test successful</h2>
              <p style="color:#6b7280;margin:0 0 20px;">This is a test message from the ARC data pipeline monitor. If you received it, email alerts are configured correctly.</p>
              <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#374151;margin:0 0 8px;">For reference</h3>
              <ul style="margin:0 0 24px;padding-left:18px;">
                <li>Recipients are controlled by the <strong>ALERT_EMAILS</strong> secret (comma-separated addresses).</li>
                <li>Real alerts are sent daily at 04:00 UTC only when a data source is out of date.</li>
                <li>Push notifications are delivered to the ntfy topic <strong>arc-ecovillage-status-7k3m</strong>.</li>
              </ul>
              <p style="margin:0;">
                <a href="https://actionresearchprojects.net/status"
                   style="display:inline-block;background:#111827;color:#ffffff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;">
                  View the status page
                </a>
              </p>
            </body>
            </html>

      - name: Send test ntfy notification
        run: |
          curl -s -X POST \
            -H "Title: ARC Monitor: alert system test" \
            -H "Priority: default" \
            -d "Test notification from the ARC data pipeline monitor. If you received this, push alerts are configured correctly." \
            https://ntfy.sh/arc-ecovillage-status-7k3m
          echo "ntfy notification sent to arc-ecovillage-status-7k3m"

      - name: Summary
        run: |
          echo "Test complete."
          echo "  Email sent to: ${{ secrets.ALERT_EMAILS }}"
          echo "  ntfy topic:    arc-ecovillage-status-7k3m"
