name: Test alert system

on:
  workflow_dispatch:   # run manually from GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ ARC Monitor test – alert system is working"
          to: ${{ secrets.ALERT_EMAILS }}
          from: ARC Monitor <${{ secrets.GMAIL_USERNAME }}>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head><meta charset="utf-8"></head>
            <body style="font-family:system-ui,sans-serif;color:#111827;max-width:600px;margin:0 auto;padding:20px;">
              <h2 style="color:#15803d;">✅ ARC Monitor – test successful</h2>
              <p>This is a test message from the ARC data pipeline monitor.</p>
              <p>If you received this, <strong>email alerts are configured correctly</strong>.</p>
              <h3>ℹ️ Notes</h3>
              <ul>
                <li>Recipients are controlled by the <strong>ALERT_EMAILS</strong> secret (comma-separated addresses).</li>
                <li>Real alerts fire daily at 04:00 UTC if any data source is stale.</li>
                <li>ntfy push notifications go to topic <strong>arc-ecovillage-status-7k3m</strong>.</li>
              </ul>
              <p style="margin-top:24px;">
                <a href="https://actionresearchprojects.net/status"
                   style="display:inline-block;background:#111827;color:white;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;">
                  View status page &rarr;
                </a>
              </p>
            </body>
            </html>

      - name: Send test ntfy notification
        run: |
          curl -s -X POST \
            -H "Title: ARC Monitor test" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -d "Test notification from ARC data pipeline monitor. If you see this, ntfy alerts are working." \
            https://ntfy.sh/arc-ecovillage-status-7k3m
          echo "ntfy notification sent to arc-ecovillage-status-7k3m"

      - name: Summary
        run: |
          echo "Test complete."
          echo "  Email sent to: ${{ secrets.ALERT_EMAILS }}"
          echo "  ntfy topic:    arc-ecovillage-status-7k3m"
