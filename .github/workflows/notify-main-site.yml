name: Notify main site on push

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.html'
      - 'logo/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main site sync
        run: |
          # source_repo names the repo as it is on GitHub. The main site's
          # sync-embedded.yml maps both this and the former arc_tz_temp_humid to
          # embedded/arc_temp_humid/, so the two never had to change in lockstep.
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MAIN_SITE_PAT }}" \
            https://api.github.com/repos/actionresearchprojects/actionresearchprojects.github.io/dispatches \
            -d '{"event_type":"sync-embedded","client_payload":{"source_repo":"arc_temp_humid"}}'
